name: Windows replacement-layout build

on:
  push:
    branches:
      - fix/replacement-translation-layout
      - fix/replacement-translation-layout-b2
      - fix/replacement-translation-layout-b3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows sidecar stub
        run: npm run build:swift

      - name: Lint
        run: npm run lint

      # The repository's npm typecheck also runs the Rust protocol exporter,
      # which causes a full debug Rust compile before the release Tauri build.
      # Official PR CI runs that protocol gate in parallel; for this packaging
      # job, run the TypeScript compiler directly so Windows gets to the real
      # release build without compiling the backend twice.
      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Replacement translation tests
        run: npx vitest run src/lens/replaceTextLayout.test.ts src/lens/replaceTextRenderer.test.ts src/lens/ReplaceTranslateOverlay.test.tsx src/api/tauri.replaceProtocol.test.ts

      - name: Replacement visual benchmark
        run: npm run test:replace-visual

      - name: Build Windows NSIS installer
        run: npx tauri build --bundles nsis

      - name: Package portable zip
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -Version 2.9.6-layout-b3

      - name: Rename B3 installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          Rename-Item -LiteralPath $installer.FullName -NewName 'Kivio-Desktop_2.9.6-layout-b3_x64-setup.exe'

      - name: Verify artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*layout-b3*.exe' | Select-Object -First 1
          $portable = Get-ChildItem 'src-tauri/target/release/bundle/portable' -Filter '*layout-b3*.zip' | Select-Object -First 1
          if (-not $installer) { throw 'B3 NSIS installer missing' }
          if (-not $portable) { throw 'B3 portable zip missing' }
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"
          Write-Host "Portable: $($portable.FullName) ($($portable.Length) bytes)"
          Get-FileHash -Algorithm SHA256 $installer.FullName
          Get-FileHash -Algorithm SHA256 $portable.FullName

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Kivio-Desktop-2.9.6-layout-b3-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*layout-b3*.exe
            src-tauri/target/release/bundle/portable/*layout-b3*.zip
